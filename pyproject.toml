[project]
name = "ct-landscape"
version = "0.1.0"
description = "ClinicalTrials.gov landscape-question agent: one DuckDB index, a small tool-using agent, a verified and traceable chat UI."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.1",
    "pydantic>=2.8",
    "pydantic-ai-slim[anthropic]>=0.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "pyarrow>=25.0.1",
]

[project.scripts]
ctl = "ct_landscape.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ct_landscape"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # starlette.testclient still uses the anyio.abc.BlockingPortal alias; goes away on the next starlette bump
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]

[tool.ruff]
line-length = 110
target-version = "py314"
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
