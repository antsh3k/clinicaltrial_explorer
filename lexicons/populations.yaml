# Typed population lexicon (spec §5.5, App. B.8): biomarkers AND patient subgroups. Word-boundary regexes
# (case-insensitive) run over title + listed conditions + eligibility text; the matched line is stored as
# evidence. Deliberately v1-modest: high precision, labeled recall.
#
# kinds: biomarker | demographic | disease_severity | prior_therapy | line_of_therapy | disease_stage
entries:
