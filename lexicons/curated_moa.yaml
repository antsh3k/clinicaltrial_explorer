# Curated mechanism tier (provenance 'curated', tier 2: below ChEMBL, above NLM classes and the LLM tier).
# Hand-written, gene-level mechanisms for pipeline assets that ChEMBL/NLM do not carry yet, each with its source.
# Entries resolve by name/alias through asset_aliases at load time, so one file serves every index. Symbols are HGNC.
# Modality vocabulary matches enrich/models.py. Never overwrites a higher tier; readers see the provenance.
