# Regexes for a sponsor string that DECLARES its own parent ("X, a Y company", "X, a subsidiary of Y",
# "X now a wholly owned subsidiary of Y"). The declared parent is taken as the company — this is the
# registry asserting the relationship, not a fuzzy match. Group 1 = subsidiary, group 2 = parent.
declared_parent_patterns:
  - '^(.+?),?\s+(?:is\s+)?now\s+(?:a\s+)?(?:wholly[- ]owned\s+)?(?:subsidiary|part|division|member|affiliate)\s+of\s+(.+)$'
  - '^(.+?),\s+(?:an?\s+)?(?:wholly[- ]owned\s+)?(?:subsidiary|affiliate|division|unit|member|part)\s+of\s+(.+)$'
  - '^(.+?)\s+\((?:an?\s+)?(?:wholly[- ]owned\s+)?(?:subsidiary|affiliate|division)\s+of\s+(.+)\)$'
  - '^(.+?),\s+an?\s+(.+?)\s+(?:company|group|subsidiary|affiliate|division)$'
  - '^(.+?)\s+-\s+an?\s+(.+?)\s+(?:company|group)$'
  - '^(.+?),\s+an?\s+(?:healthcare|pharmaceutical|biotech)\s+(?:company|business)\s+of\s+(.+)$'
  - '^(.+?),\s+(?:formerly|previously)\s+(?:known\s+as\s+)?(.+)$'
