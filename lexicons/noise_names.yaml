# whole label STARTS WITH one of these (word-boundary)
starts_with:
  - placebo
  - placebos
  - matching placebo
  - matched placebo
  - sham
  - vehicle
  - dummy
  - saline placebo
  - oral placebo
  - iv placebo
  - intravenous placebo
  - subcutaneous placebo
  - topical placebo
  - inactive

# whole label CONTAINS one of these phrases (metadata / procedure cues, not molecules)
contains:
  - regimen
  - dose escalation
  - dose expansion
  - questionnaire
  - blood sample
  - blood draw
  - biopsy
  - primary outcome
  - secondary outcome
  - frequency of
  - evaluation of
  - assessment of
  - "group:"
  - " arm "
  - " cohort "
  - listed out below
  - see below
  - as described

# regex rules (whole label must FULLY match)
regex:
  - '(placebo|sham|vehicle|dummy)( (for|to|of|matching|matched)?\s*.*)?'   # "placebo for pembrolizumab": the WHOLE label dies
  - '.*\b(placebo|sham)\b.*(comparator|control|arm|group|tablet|capsule|injection|pill|cream|gel|solution|infusion|patch|inhaler)s?\b.*'
  - '(taper(ing)?|tapered)( .*)?'
  - '(treatment|arm|group|cohort|drug|dose|regimen) ?[a-d0-9]'                # "Treatment C", "Arm 1"
  - '(low|high|medium|mid|standard) dose'
  - '.*\((placebo|sham)\).*'                                                    # "Nitrogen (placebo)"
  - 'anti[- ][a-z0-9\-]+( (antibody|antibodies|monoclonal antibody|therapy|agent|inhibitor|blocker))?'   # class shape: needs a separator so "antipyrine" survives
  - '[a-z0-9]+[- ]based( .*)?'
  - '.* (inhibitors?|antagonists?|agonists?|therapy|therapies|agents?|analogs?|analogues?|blockers?|modulators?)'   # bare class suffix w/o molecule; molecules are single-token names before this
  - '(standard|usual|best|conventional|routine|optimal) (of )?(care|practice|treatment|therapy|medical (treatment|therapy|management))( .*)?'   # "standard of care chemotherapy" dies whole
  - '.*\b(analysis|analyses|sequencing|genotyping|profiling|hybridization|hybridisation|sampling|collection|assessment|assessments|imaging|scan|scans|assay|assays|survey|surveys|interview|interviews|monitoring)'   # assay / procedure tail
