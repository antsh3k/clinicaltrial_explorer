# Intervention-name noise gates (spec App. B.3). WHOLE-LABEL semantics: a name is rejected only when the
# entire cleaned, lowercased label matches a rule — never by substring ("pembrolizumab immunotherapy" survives).
# Every rejection is counted by gate name in the build census.

# exact whole-label matches
