# Curated condition synonyms for the agent's resolve_entity ladder (spec §7.2 "kind=condition returns the MeSH key
# when one exists"). Surfaces are folded with normalize.conditions.fold at load, so write them naturally.
#
# This file is READ ONLY BY THE RESOLVER. It never touches the persisted condition keyspace (§5.3): a trial that
# lists "NSCLC" without the MeSH leaf keeps its listed-only key, and the resolver reports that sibling key in its
# note so the two keyspaces are never summed silently.
#
# Two kinds of entry: abbreviations the registry uses as bare condition strings (NSCLC, RCC, IPF), and lay phrasings
# whose tokens the generic cancer/carcinoma/neoplasm fold cannot bridge (prostate → Prostatic, gastric → Stomach,
# bladder → Urinary Bladder). Phrasings the fold already handles ("lung cancer" ↔ "Lung Neoplasms", "renal cell
# carcinoma" ↔ "Carcinoma, Renal Cell") are deliberately NOT listed. Every id was checked against the
# conditionBrowseModule meshes of the 2026-09-04 snapshot; `term` is the descriptor name at that time, for review.
