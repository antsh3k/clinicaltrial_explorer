# Gold set (spec §8.3). 12 core cases across the seven archetypes + 2 borderline variants.
#
# HONESTY RULE: expected sets are frozen against an oracle independent of this pipeline's entity/view layers —
# the RAW dump (mesh_terms ∪ study_conditions, interventions ∪ otherNames), every candidate read and adjudicated
# one by one — never from this system's answers. `adjudicated_by` records who froze each set and how; the
# repository owner's sign-off on the Fable-5.1-adjudicated sets is pending. Cases with `adjudicated: false`
# carry expectations drawn from the design spec's case table (public knowledge); their set-based metrics are
# reported as DIAG, never gated, until adjudicated.
metadata:
  source: "G01–G07: candidates enumerated by SQL over the RAW layer of the 2026-09-04 dump (never the entity/view layers), each read and adjudicated by Claude Fable 5.1 on 2026-09-04 (see `adjudicated_by`); the repository owner's sign-off is pending. G08–G12 are behavioural checks with no set to adjudicate."
  as_of: "2026-09-04"
  thresholds: {nct_precision: 0.80, nct_recall: 0.70, entity_f1: 0.75, min_pooled_gold_items: 30}
  n_cases: 14

cases:
  - id: G01
    archetype: Q1
    question: "What drugs are currently in development for Erdheim-Chester disease?"
    check: entity_set
    expected:
      entities: [cobimetinib, vemurafenib, dabrafenib, trametinib, lenalidomide, Q702]
      condition_key: D031249
    raw_ui_count: 22
    note: "22 ECD trials in the dump (12 interventional). Drugs with an ACTIVE-status interventional trial: dabrafenib+trametinib (NCT07440290 Ph3), vemurafenib+cobimetinib (NCT05768178 Ph3), cobimetinib (NCT04079179 Ph2), lenalidomide (NCT02523040 Ph2 active-not-recruiting), Q702 Axl/Mer/CSF1R inhibitor (NCT06712810 Ph1). Excluded: HLX208 (NCT05092815, status UNKNOWN since 2021), [68Ga]-pentixafor (NCT05093335, a PET tracer), and terminated/withdrawn-only drugs (tocilizumab, bevacizumab, HH2710). An answer that also lists HLX208 is defensible."
    adjudicated: true
    adjudicated_by: "Claude Fable 5.1, 2026-09-04 — raw-layer SQL over the 2026-09-04 dump (mesh_terms ∪ study_conditions, interventions ∪ otherNames), every candidate read by hand; owner sign-off pending"

  - id: G02
    archetype: Q2
    question: "What are the most advanced clinical programs in geographic atrophy?"
    check: top_k_contains
    expected:
      entities: [pegcetacoplan, avacincaptad pegol]
      k: 10
      must_mention: ["approv"]
      condition_key: D057092
    raw_ui_count: 186
    note: "186 GA trials in the dump. Phase 3 programs: pegcetacoplan (NCT03525600/NCT03525613/NCT04770545/NCT07214740), avacincaptad pegol (NCT02686658/NCT04435366/NCT05536297, Ph4 NCT06970665), pozelimab+cemdisiran (NCT06541704), vonaprument/ANX007 (NCT06510816), tinlarebant (NCT05949593), plus terminated lampalizumab and completed emixustat/ALK-001. Both gold agents are unambiguously in any top-10 by phase; the answer must carry the 'trial-derived stage ≠ approval' caveat."
    adjudicated: true
    adjudicated_by: "Claude Fable 5.1, 2026-09-04 — raw-layer SQL over the 2026-09-04 dump (mesh_terms ∪ study_conditions, interventions ∪ otherNames), every candidate read by hand; owner sign-off pending"

  - id: G03
    archetype: Q3
    question: "Which companies are most active in multiple myeloma? Please count J&J and Celgene programs correctly."
    check: top_k_contains
    expected:
      entities: ["johnson johnson janssen", "bristol myers squibb"]
      k: 5
      must_mention: ["lead sponsor"]
      condition_key: D009101
    note: "Gold spells J&J and Celgene to force company aliasing (Celgene → BMS, acq. 2019). Raw lead-sponsor counts (INDUSTRY, MM by mesh ∪ text): Celgene 92 + Celgene Corporation 10 + BMS 39 + Juno 8 ≈ 149 → BMS family; Janssen R&D 66 + other Janssen/J&J entities ≈ 121 → J&J family; then Takeda+Millennium 54, Amgen 43, GSK 40. Both gold entities sit at ranks 1–2 under any reasonable aliasing. The answer must state its scope (industry lead sponsors; collaborators excluded unless asked) — the sponsor ≠ collaborator probe."
    adjudicated: true
    adjudicated_by: "Claude Fable 5.1, 2026-09-04 — raw-layer SQL over the 2026-09-04 dump (mesh_terms ∪ study_conditions, interventions ∪ otherNames), every candidate read by hand; owner sign-off pending"

  - id: G04
    archetype: Q4
    question: "What mechanisms of action and therapeutic targets are being investigated in idiopathic pulmonary fibrosis?"
    check: contains_all
    expected:
      entities: [PDE4B, ITGB6, LPAR1]
      condition_key: D054990
    note: "Raw IPF trials carrying each anchor: nerandomilast/BI 1015550 (PDE4B) 5, bexotegrast/PLN-74809 (αvβ6 integrin, ITGB6) 4, admilparant/BMS-986278 (LPA1, LPAR1) 6 — all Phase 2/3, so the three mechanisms are genuinely under investigation. Coverage caveat: none of the three is in ChEMBL/NLM; on the demo index only nerandomilast carries an (LLM) label, and the shipped pilot labelled admilparant 'CCR4 antagonist' (wrong) — misses here measure the enrichment tier, not the gold. The vacuous must_mention 'of ' was removed; the labeled-fraction sentence is checked by reading."
    adjudicated: true
    adjudicated_by: "Claude Fable 5.1, 2026-09-04 — raw-layer SQL over the 2026-09-04 dump (mesh_terms ∪ study_conditions, interventions ∪ otherNames), every candidate read by hand; owner sign-off pending"

