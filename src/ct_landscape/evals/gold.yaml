  - id: G06
    archetype: Q6
    question: "Which biomarkers and patient subgroups are commonly targeted in non-small cell lung cancer trials?"
    check: contains_all
    expected:
      entities: [EGFR, ALK, PDL1, ROS1, KRAS]
      must_mention: ["first-line", "metastatic"]
      condition_key: D002289
    note: "Raw NSCLC trials mentioning each biomarker (title/eligibility/summary, word-bounded): EGFR 2,892 · ALK 1,632 · PD-L1 1,415 · ROS1 ~700 · BRAF ~430 · HER2 ~360 · KRAS G12C 148. 'Commonly targeted' therefore means EGFR/ALK/PD-L1/ROS1/KRAS; the spec-table seed's KRAS_G12C and MET were demoted (G12C is ~5% of EGFR's count; 'MET' is a 3-letter id the matcher can only hit exactly and MET exon 14 has ~80 trials). KRAS also matches KRAS_G12C by the substring rule. ≥2 subgroup kinds (line_of_therapy, disease_stage, prior_therapy) via must_mention. DIAG-weighted (lexicon surface); FLOORs still apply."
    adjudicated: true
    adjudicated_by: "Claude Fable 5.1, 2026-09-04 — raw-layer SQL over the 2026-09-04 dump (mesh_terms ∪ study_conditions, interventions ∪ otherNames), every candidate read by hand; owner sign-off pending"

  - id: G07
    archetype: Q7
    question: "What combination partners are being studied with MK-3475 in renal cell carcinoma?"
    check: contains_all
    expected:
      entities: [lenvatinib, axitinib, belzutifan]
      condition_key: D002292
      asset_id: pembrolizumab
    oracle_url: "https://clinicaltrials.gov/search?cond=Renal%20Cell%20Carcinoma&intr=pembrolizumab"
    raw_ui_count: 144
    note: "Asked as MK-3475 to force alias resolution. 144 RCC trials list pembrolizumab/MK-3475/Keytruda. Raw co-listed drugs: nivolumab 17 (almost always the comparator arm, not a partner), lenvatinib 15+1, axitinib 12, belzutifan 8, ipilimumab 6, cabozantinib 5, atezolizumab 5 — the three gold partners are the three largest true combination programs (CLEAR/KEYNOTE-581, KEYNOTE-426, LITESPARK-011/022). Named agents only: class labels like 'chemotherapy' are gated out before assets exist (§5.1)."
    adjudicated: true
    adjudicated_by: "Claude Fable 5.1, 2026-09-04 — raw-layer SQL over the 2026-09-04 dump (mesh_terms ∪ study_conditions, interventions ∪ otherNames), every candidate read by hand; owner sign-off pending"

  - id: G08
    archetype: negative
    question: "What trials are studying pembrolizumab for Erdheim-Chester disease?"
    check: honest_empty
    expected:
      must_mention: ["no ", "not "]
      condition_key: D031249
      asset_id: pembrolizumab
    note: "Drug × indication never studied → the answer must assert absence with a caveat, cite nothing, and name no program. dishonest_empty FLOOR."
    adjudicated: true

  - id: G09
    archetype: negative
    question: "Is pembrolizumab approved for renal cell carcinoma?"
    check: refuse_approval
    expected:
      must_mention: ["approv"]
      must_not_mention: ["is approved", "was approved", "has been approved"]
      asset_id: pembrolizumab
      condition_key: D002292
    note: "Must refuse to infer approval from Phase-4 / completed trials; trial-derived stage caps at Phase 3."
    adjudicated: true

  - id: G10
    archetype: messiness
    question: "Is docetaxel in development for non-small cell lung cancer?"
    check: role_split
    expected:
      must_mention: ["comparator", "subject"]
      asset_id: docetaxel
      condition_key: D002289
    note: "Answer must separate subject-role trials from comparator-role appearances (three-valued roles)."
    adjudicated: true

  - id: G11
    archetype: messiness
    question: "How many trials study pembrolizumab in combination with another named drug in renal cell carcinoma, and how many pembrolizumab trials in renal cell carcinoma are there in total? Do the numbers reconcile?"
    check: reconcile
    expected:
      asset_id: pembrolizumab
      condition_key: D002292
    note: "v_combos-derived count ≤ v_programs count; the harness recomputes both by SQL and checks the answer's numbers match."
    adjudicated: true

  - id: G12
    archetype: messiness
    question: "How many drugs are in development for advanced non-small cell lung cancer versus lung cancer in general, and how did you decide which trials count?"
    check: states_rollup
    expected:
      must_mention: ["mesh"]
      condition_key: D002289
    note: "Answer must state rollup behaviour explicitly (listed vs mesh_leaf vs ancestor; one keyspace per query; 'advanced' is a stage qualifier, not a separate condition)."
    adjudicated: true

